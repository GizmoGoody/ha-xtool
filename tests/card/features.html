<!doctype html>
<meta charset="utf-8">
<title>xTool card: tile features</title>
<style>
  body { margin: 0; padding: 16px; background: #111; color: #ddd; font: 13px Roboto, "Segoe UI", sans-serif; }
  pre { white-space: pre-wrap; }
</style>
<script src="stand-ins.js"></script>
<script src="../../custom_components/xtool/frontend/xtool-card.js"></script>
<script src="checks.js"></script>
<div id="cards"></div>
<pre id="report" data-result="running">running</pre>
<script>
  const keysOf = (el) => [...el.shadowRoot.querySelectorAll(".key")];
  const keyNamed = (el, key) => el.shadowRoot.querySelector(`.key[data-key="${key}"]`);
  // Home Assistant's confirmation dialog: what it asks, if anything
  const asking = () => window.confirming;
  const lastAction = () => window.actions[window.actions.length - 1];
  const lastCall = (hass) => hass.calls[hass.calls.length - 1];

  runChecks(async () => {
    // Job: processing
    let hass = makeHass({ "sensor.f2_status": "processing" });
    let job = addFeature({ type: "custom:xtool-job" }, { hass });
    await wait(50);
    check("job, processing", keysOf(job).map((k) => k.dataset.key).join() === "pause,cancel", "Pause and Cancel");
    keyNamed(job, "pause").click();
    check("job, processing", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "button", service: "press", data: { entity_id: "button.f2_pause" } }),
      "Pause presses the pause button");
    keyNamed(job, "cancel").click();
    await wait(20);
    check("job, processing", asking()?.title === "Cancel the job?" && asking().confirm_text === "Cancel the job" && asking().dismiss_text === "Keep it",
      "Cancel asks first, in Home Assistant's confirmation dialog");
    check("job, processing", JSON.stringify(lastAction()?.config.tap_action.target) === JSON.stringify({ entity_id: "button.f2_cancel" })
      && lastAction().config.tap_action.perform_action === "button.press" && lastAction().action === "tap", "as a perform-action, through Home Assistant's action handling");
    asking().answer(false);
    check("job, processing", lastCall(hass).data.entity_id === "button.f2_pause", "Keep it does not cancel");
    keyNamed(job, "cancel").click();
    await wait(20);
    asking().answer(true);
    check("job, processing", lastCall(hass).data.entity_id === "button.f2_cancel", "confirming cancels");

    // Job: idle and paused
    hass = makeHass({ "sensor.f2_status": "idle" });
    job = addFeature({ type: "custom:xtool-job" }, { hass });
    await wait(50);
    check("job, idle", keyNamed(job, "resume").textContent === "Start" && !keyNamed(job, "resume").disabled && keyNamed(job, "cancel").disabled,
      "Start, and Cancel off");
    hass = makeHass({ "sensor.f2_status": "paused" });
    job = addFeature({ type: "custom:xtool-job", confirm_cancel: false }, { hass });
    await wait(50);
    check("job, paused", keyNamed(job, "resume").textContent === "Resume", "Resume");
    keyNamed(job, "cancel").click();
    await wait(20);
    check("job, paused", !asking() && lastCall(hass).data.entity_id === "button.f2_cancel", "without asking, when turned off in the options");

    // Peripherals
    hass = makeHass({ "sensor.f2_status": "idle" });
    let row = addFeature({ type: "custom:xtool-peripherals" }, { hass });
    await wait(50);
    check("peripherals", keysOf(row).map((k) => k.dataset.key).join() === "power,exhaust,fill_light_front,fill_light_back,red_dot",
      "every part the F2 Ultra UV has, in order");
    check("peripherals", keyNamed(row, "exhaust").getAttribute("aria-pressed") === "true" && keyNamed(row, "red_dot").getAttribute("aria-pressed") === "false",
      "on and off shown");
    keyNamed(row, "exhaust").click();
    check("peripherals", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "switch", service: "turn_off", data: { entity_id: "switch.f2_exhaust" } }),
      "a tap turns the exhaust off");
    keyNamed(row, "fill_light_back").click();
    check("peripherals", lastCall(hass).domain === "light" && lastCall(hass).service === "turn_on", "a tap turns the back fill light on");
    keyNamed(row, "power").click();
    await wait(20);
    check("peripherals", !asking() && lastCall(hass).data.entity_id === "switch.f2_power", "Power turns off without asking while idle");
    hass = makeHass({ "sensor.f2_status": "processing" });
    row = addFeature({ type: "custom:xtool-peripherals", controls: ["red_dot", "power"], show_names: true }, { hass });
    await wait(50);
    check("peripherals, chosen", keysOf(row).map((k) => k.dataset.key).join() === "red_dot,power" && keyNamed(row, "red_dot").textContent === "Red dot",
      "the chosen parts, in the chosen order, with names");
    keyNamed(row, "power").click();
    await wait(20);
    check("peripherals, chosen", asking()?.title === "Turn off power?" && hass.calls.length === 0, "Power asks first while a job runs");
    asking().answer(false);

    // The fill lights stay buttons in the peripherals feature: on or off only
    hass = makeHass();
    row = addFeature({ type: "custom:xtool-peripherals" }, { hass });
    await wait(50);
    const front = keyNamed(row, "fill_light_front");
    check("fill lights as buttons", front.getAttribute("aria-pressed") === "true" && !front.classList.contains("dimmable"), "a button, with no dimming");
    front.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, clientX: 10, clientY: 10 }));
    front.dispatchEvent(new PointerEvent("pointermove", { bubbles: true, clientX: 200, clientY: 10 }));
    front.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, clientX: 200, clientY: 10 }));
    check("fill lights as buttons", hass.calls.length === 0, "dragging across a button does nothing");
    front.click();
    check("fill lights as buttons", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "light", service: "turn_off", data: { entity_id: "light.f2_fill_front" } }),
      "a tap turns it off");
    const options = document.createElement("xtool-feature-editor");
    options.hass = makeHass();
    options.context = { entity_id: "sensor.f2_status" };
    options.setConfig({ type: "custom:xtool-peripherals" });
    const optionNames = options.querySelector("ha-form").schema.map((s) => s.name);
    check("fill lights as buttons", !optionNames.includes("dim_lights") && optionNames.includes("animate_fan"), `the options have no dimming (${optionNames.join(", ")})`);

    // Fill light brightness: Home Assistant's own light brightness feature, for the chosen fill light
    hass = makeHass();
    const frontLight = addFeature({ type: "custom:xtool-fill-light", light: "fill_light_front" }, { hass });
    const backLight = addFeature({ type: "custom:xtool-fill-light", light: "fill_light_back" }, { hass });
    await wait(50);
    const frontFeature = frontLight.shadowRoot.querySelector("hui-card-feature");
    const backFeature = backLight.shadowRoot.querySelector("hui-card-feature");
    check("fill light", frontFeature?.feature.type === "light-brightness" && frontFeature.context.entity_id === "light.f2_fill_front"
      && backFeature?.context.entity_id === "light.f2_fill_back", "Home Assistant's light brightness feature, for the chosen light");
    check("fill light", !!frontFeature.shadowRoot.querySelector("hui-light-brightness-card-feature")?.hass, "drawn by Home Assistant, with hass");
    check("fill light", !frontLight.shadowRoot.querySelector("input, ha-control-slider"), "no slider of the card's own");
    check("fill light", frontLight.style.getPropertyValue("--feature-color") === "rgb(214, 228, 255)" && frontFeature.color === frontLight.style.getPropertyValue("--feature-color")
      && backLight.style.getPropertyValue("--feature-color").includes("--state-light-inactive-color"), "daylight when on, Home Assistant's off color when off");
    frontLight.hass = makeHass({ "light.f2_fill_front": { state: "on", attributes: { rgb_color: [255, 0, 0] } } });
    check("fill light", frontLight.style.getPropertyValue("--feature-color") === "rgb(255, 0, 0)", "a light's own color, when it has one");
    const stub = customElements.get("xtool-fill-light").getStubConfig(makeHass(), { entity_id: "sensor.f2_status" });
    check("fill light", stub.light === "fill_light_front", "a new feature starts with the first fill light");
    const lightOptions = document.createElement("xtool-feature-editor");
    lightOptions.hass = makeHass();
    lightOptions.context = { entity_id: "sensor.f2_status" };
    lightOptions.setConfig({ type: "custom:xtool-fill-light", light: "fill_light_back" });
    const lightField = lightOptions.querySelector("ha-form");
    check("fill light", lightField.data.light === "fill_light_back"
      && lightField.schema[0].selector.select.options.map((o) => o.value).join() === "fill_light_front,fill_light_back", "the editor offers each fill light");
    const none = addFeature({ type: "custom:xtool-fill-light" }, { hass: makeHass(), entityId: "sensor.p2_status" });
    await wait(50);
    check("fill light", !none.shadowRoot.querySelector("hui-card-feature"), "none for a laser without fill lights");

    // Animate fan: the exhaust's icon turns while it runs
    row = addFeature({ type: "custom:xtool-peripherals" }, { hass: makeHass() });
    await wait(50);
    check("animate fan", keyNamed(row, "exhaust").querySelector("ha-icon").classList.contains("spin"), "the running exhaust fan turns");
    check("animate fan", !keyNamed(row, "red_dot").querySelector("ha-icon").classList.contains("spin"), "other icons do not");
    row = addFeature({ type: "custom:xtool-peripherals", animate_fan: false }, { hass: makeHass() });
    await wait(50);
    check("animate fan", !keyNamed(row, "exhaust").querySelector("ha-icon").classList.contains("spin"), "it can be turned off");
    row = addFeature({ type: "custom:xtool-peripherals" }, { hass: makeHass({ "switch.f2_exhaust": "off" }) });
    await wait(50);
    check("animate fan", !keyNamed(row, "exhaust").querySelector("ha-icon").classList.contains("spin"), "a fan that is off is still");

    // Safety checks
    hass = makeHass({ "switch.f2_moved": "off" });
    row = addFeature({ type: "custom:xtool-safety" }, { hass });
    await wait(50);
    check("safety", keysOf(row).map((k) => k.dataset.key).join() === "flame_alarm,enclosure_stop,moved_stop", "the three checks");
    check("safety", !keyNamed(row, "auto_mode"), "auto mode is not a safety check");
    const moved = keyNamed(row, "moved_stop"), flame = keyNamed(row, "flame_alarm");
    check("safety", moved.classList.contains("fill") && moved.style.getPropertyValue("--c") === "var(--red-color)" && moved.getAttribute("aria-pressed") === "false",
      "a check that is off is red");
    check("safety", !flame.classList.contains("fill") && flame.style.getPropertyValue("--c") === "var(--green-color)" && flame.getAttribute("aria-pressed") === "true",
      "a check that is on is green");
    check("safety", !row.shadowRoot.querySelector(".warn, i"), "no dots");
    keyNamed(row, "moved_stop").click();
    await wait(20);
    check("safety", !asking() && lastCall(hass).service === "turn_on", "turning a check on does not ask");
    keyNamed(row, "flame_alarm").click();
    await wait(20);
    check("safety", asking()?.text.includes("No flame alarm will be triggered") && asking().confirm_text === "Turn off",
      "turning the flame alarm off asks, with xTool's warning");
    check("safety", !document.querySelector("dialog") && !row.shadowRoot.querySelector("dialog"), "no dialog of the card's own");
    asking().answer(true);
    check("safety", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "switch", service: "turn_off", data: { entity_id: "switch.f2_flame" } }),
      "confirming turns it off");

    // Settings: the laser's own
    hass = makeHass();
    row = addFeature({ type: "custom:xtool-settings" }, { hass });
    await wait(50);
    check("settings", keysOf(row).map((k) => k.dataset.key).join() === "buzzer,device_sleep,auto_mode", "buzzer reminders, device sleep, auto mode; no accessories");
    keyNamed(row, "auto_mode").click();
    await wait(20);
    check("settings", !asking() && JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "switch", service: "turn_on", data: { entity_id: "switch.f2_auto_mode" } }),
      "auto mode turns on and off with a tap, without asking");

    // Accessories: their own feature, hidden while the laser does not see them
    row = addFeature({ type: "custom:xtool-accessories" }, { hass });
    await wait(50);
    check("accessories", keysOf(row).map((k) => k.dataset.key).join() === "if2_buzzer" && row.style.display === "", "the IF2 buzzer");
    keyNamed(row, "if2_buzzer").click();
    check("accessories", lastCall(hass).data.entity_id === "switch.if2_buzzer", "found on the accessory device");
    row = addFeature({ type: "custom:xtool-accessories" }, { hass: makeHass({ "switch.if2_buzzer": "unavailable" }) });
    await wait(50);
    check("accessories", row.style.display === "none", "hidden while the IF2 is unavailable");

    // Camera: Home Assistant's own image element, with buttons to switch cameras
    hass = makeHass();
    const camera = addFeature({ type: "custom:xtool-camera" }, { hass });
    await wait(80);
    const image = camera.shadowRoot.querySelector(".shot hui-image");
    check("camera", image?.cameraImage === "camera.f2_main" && image.entity === "camera.f2_main" && image.cameraView === "auto" && image.hass === hass,
      "Home Assistant's image element shows the main camera, in the Auto view");
    check("camera", !camera.shadowRoot.querySelector(".shot > img"), "no picture of the card's own");
    check("camera", keysOf(camera).map((k) => k.textContent).join() === "Main,Deep", "buttons for both cameras");
    keyNamed(camera, "camera.f2_deep").click();
    await wait(50);
    check("camera", image.cameraImage === "camera.f2_deep", "switching shows the deep camera");
    let opened;
    camera.addEventListener("hass-more-info", (ev) => (opened = ev.detail.entityId));
    camera.shadowRoot.querySelector(".shot").click();
    check("camera", opened === "camera.f2_deep", "a tap opens the camera");
    const live = addFeature({ type: "custom:xtool-camera", camera: "Deep", camera_view: "live", show_switch: false }, { hass });
    await wait(80);
    check("camera, live", live.shadowRoot.querySelector("hui-image").cameraView === "live" && live.shadowRoot.querySelector("hui-image").cameraImage === "camera.f2_deep"
      && keysOf(live).length === 0, "the chosen camera, live, without buttons");

    const offCamera = addFeature({ type: "custom:xtool-camera" }, { hass: makeHass({ "sensor.f2_status": "off" }) });
    await wait(60);
    check("camera, off", offCamera.style.display === "none", "hidden while the laser is off");
    offCamera.hass = makeHass();
    await wait(60);
    check("camera, off", offCamera.style.display === "", "shown again once it is on");

    // The updated time: when Home Assistant's image shows a new picture
    const imageLoad = (feature) => feature.shadowRoot.querySelector("hui-image").shadowRoot.querySelector("img").dispatchEvent(new Event("load"));
    imageLoad(camera);
    check("camera, time", camera.shadowRoot.querySelector(".time").textContent === "", "no time unless chosen");
    const stamped = addFeature({ type: "custom:xtool-camera", show_time: true }, { hass });
    await wait(60);
    check("camera, time", !stamped.shadowRoot.querySelector(".time hui-timestamp-display"), "no time before a picture arrives");
    imageLoad(stamped);
    const element = stamped.shadowRoot.querySelector(".time hui-timestamp-display");
    check("camera, time", !!element && element.ts instanceof Date && element.format === undefined && element.hass === hass
      && stamped.shadowRoot.querySelector(".time").textContent === "Updated ", "Home Assistant's timestamp display, in its default format outside the xTool card");
    const liveTime = addFeature({ type: "custom:xtool-camera", camera_view: "live", show_time: true }, { hass });
    await wait(60);
    imageLoad(liveTime);
    check("camera, time", liveTime.shadowRoot.querySelector(".time").textContent === "", "no updated time on a live stream");
    const cameraOptions = document.createElement("xtool-feature-editor");
    cameraOptions.hass = hass;
    cameraOptions.context = { entity_id: "sensor.f2_status" };
    cameraOptions.setConfig({ type: "custom:xtool-camera", show_time: true });
    const cameraForm = cameraOptions.querySelector("ha-form");
    check("camera, options", !cameraForm.schema.some((s) => s.name === "time_format") && cameraForm.schema.find((s) => s.name === "show_time").helper.includes("Time format"),
      "no Time format of its own: the card's is used");
    check("camera, options", cameraForm.schema.find((s) => s.name === "camera_view").selector.select.options.map((o) => o.label).join() === "Auto,Live"
      && cameraForm.data.camera_view === "auto" && !cameraForm.schema.some((s) => s.name === "refresh"), "Auto or Live, as in the picture cards; no refresh option");

    // IF2 fan: Home Assistant's own select options feature, as buttons
    hass = makeHass();
    let fan = addFeature({ type: "custom:xtool-if2-fan" }, { hass });
    await wait(50);
    let fanFeature = fan.shadowRoot.querySelector("hui-card-feature");
    check("IF2 fan", fanFeature?.context.entity_id === "select.if2_fan" && fanFeature.feature.type === "select-options" && fanFeature.feature.style === "buttons"
      && !("options" in fanFeature.feature), "Home Assistant's select options feature, as buttons, for the IF2's fan, with every choice");
    check("IF2 fan", !!fanFeature.shadowRoot.querySelector("hui-select-options-card-feature")?.hass && !fan.shadowRoot.querySelector(".key"),
      "drawn by Home Assistant; no buttons of the card's own");
    fan = addFeature({ type: "custom:xtool-if2-fan", options: ["Auto Quiet", "Off", "4"] }, { hass });
    await wait(50);
    fanFeature = fan.shadowRoot.querySelector("hui-card-feature");
    check("IF2 fan", fanFeature.feature.options.join() === "Auto Quiet,Off,4", "only the chosen choices, in order");
    const fanOptions = document.createElement("xtool-feature-editor");
    fanOptions.hass = hass;
    fanOptions.context = { entity_id: "sensor.f2_status" };
    fanOptions.setConfig({ type: "custom:xtool-if2-fan" });
    const fanForm = fanOptions.querySelector("ha-form");
    check("IF2 fan", fanForm.data.customize_options === false && !fanForm.schema.some((s) => s.name === "options"),
      "every choice, until Customize is turned on (as in Home Assistant's editor)");
    let savedFan;
    fanOptions.addEventListener("config-changed", (ev) => (savedFan = ev.detail.config));
    fanForm.dispatchEvent(new CustomEvent("value-changed", { detail: { value: { control: "select", customize_options: true } } }));
    check("IF2 fan", savedFan.options.join() === "Auto Regular,Auto Quiet,Off,1,2,3,4" && !("customize_options" in savedFan),
      "turning Customize on starts with every choice");
    const optionsField = fanOptions.querySelector("ha-form").schema.find((s) => s.name === "options");
    check("IF2 fan", optionsField?.selector.select.reorder === true && optionsField.selector.select.mode === undefined, "then lists them, to remove or reorder");
    fanOptions.querySelector("ha-form").dispatchEvent(new CustomEvent("value-changed", { detail: { value: { control: "select", customize_options: false, options: ["Off"] } } }));
    check("IF2 fan", !("options" in savedFan), "turning it off shows every choice again");
    check("IF2 fan", fanForm.data.control === "select" && fanForm.schema[0].name === "control"
      && fanForm.schema[0].selector.select.options.map((o) => o.value).join() === "select,fan", "Controls: select options by default, or the fan");

    // IF2 fan, as a fan: Home Assistant's fan preset modes and fan speed features
    fan = addFeature({ type: "custom:xtool-if2-fan", control: "fan" }, { hass });
    await wait(50);
    const fanFeatures = [...fan.shadowRoot.querySelectorAll("hui-card-feature")];
    check("IF2 fan, fan", fanFeatures.map((f) => f.feature.type).join() === "fan-preset-modes,fan-speed"
      && fanFeatures.every((f) => f.context.entity_id === "fan.if2_fan" && f.hass === hass),
      "the fan preset modes and fan speed features, for the IF2's fan entity");
    check("IF2 fan, fan", fanFeatures[0].feature.style === "icons" && !("preset_modes" in fanFeatures[0].feature), "the Auto modes as icons, all of them");
    check("IF2 fan, fan", fanFeatures[0].color.includes("--state-fan-active-color"), "in the fan's colors");
    check("IF2 fan, fan", fan.shadowRoot.querySelectorAll(".slide").length === 2, "two rows");
    fan = addFeature({ type: "custom:xtool-if2-fan", control: "fan", preset_style: "dropdown", preset_modes: ["Auto Quiet"] }, { hass });
    await wait(50);
    const presetFeature = fan.shadowRoot.querySelector("hui-card-feature");
    check("IF2 fan, fan", presetFeature.feature.style === "dropdown" && presetFeature.feature.preset_modes.join() === "Auto Quiet", "the chosen style and Auto modes");
    fan.setConfig({ type: "custom:xtool-if2-fan" });
    await wait(20);
    check("IF2 fan, fan", [...fan.shadowRoot.querySelectorAll("hui-card-feature")].map((f) => f.feature.type).join() === "select-options",
      "changing back to select options shows the select options feature");
    fanOptions.setConfig({ type: "custom:xtool-if2-fan", control: "fan" });
    const fanNames = fanOptions.querySelector("ha-form").schema.map((s) => s.name);
    check("IF2 fan, fan", fanNames.join() === "control,preset_style,customize_modes", `the editor offers the fan's options (${fanNames.join(", ")})`);
    fanOptions.setConfig({ type: "custom:xtool-if2-fan", control: "fan", preset_modes: ["Auto Quiet"] });
    check("IF2 fan, fan", fanOptions.querySelector("ha-form").schema.map((s) => s.name).join() === "control,preset_style,customize_modes,preset_modes"
      && fanOptions.querySelector("ha-form").data.customize_modes === true, "customized Auto modes are listed");
    const noFan = addFeature({ type: "custom:xtool-if2-fan" }, { hass, entityId: "sensor.p2_status" });
    await wait(50);
    check("IF2 fan", !noFan.shadowRoot.querySelector("hui-card-feature"), "nothing for a laser without an IF2");
    const noFanEntity = addFeature({ type: "custom:xtool-if2-fan", control: "fan" }, { hass, entityId: "sensor.p2_status" });
    await wait(50);
    check("IF2 fan, fan", !noFanEntity.shadowRoot.querySelector("hui-card-feature"), "nothing as a fan either");
    for (const control of ["select", "fan"]) {
      const unseen = addFeature({ type: "custom:xtool-if2-fan", control }, { hass: makeHass({ "select.if2_fan": "unavailable", "fan.if2_fan": "unavailable" }) });
      await wait(50);
      check("IF2 fan, unavailable", unseen.style.display === "none" && !unseen.shadowRoot.querySelector("hui-card-feature"),
        `hidden while the laser does not see the IF2, with no empty rows (${control})`);
    }

    // A laser without the parts: nothing to show
    hass = makeHass();
    row = addFeature({ type: "custom:xtool-safety" }, { hass, entityId: "sensor.p2_status" });
    await wait(50);
    check("P2 safety", keysOf(row).length === 0, "no buttons for checks the laser does not have");

    // The features are offered only for lasers that have their parts
    const offered = Object.fromEntries(window.customCardFeatures.map((f) => [f.type, f.isSupported(makeHass(), { entity_id: "sensor.p2_status" })]));
    check("feature picker", offered["xtool-job"] && offered["xtool-peripherals"] && !offered["xtool-fill-light"] && !offered["xtool-safety"] && !offered["xtool-if2-fan"] && !offered["xtool-camera"],
      `offered for the P2: ${Object.entries(offered).filter(([, v]) => v).map(([k]) => k).join(", ")}`);
  });
</script>
