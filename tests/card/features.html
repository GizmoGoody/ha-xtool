<!doctype html>
<meta charset="utf-8">
<title>xTool card: tile features</title>
<style>
  body { margin: 0; padding: 16px; background: #111; color: #ddd; font: 13px Roboto, "Segoe UI", sans-serif; }
  pre { white-space: pre-wrap; }
</style>
<script src="stand-ins.js"></script>
<script src="../../custom_components/xtool/frontend/xtool-card.js"></script>
<script src="checks.js"></script>
<div id="cards"></div>
<pre id="report" data-result="running">running</pre>
<script>
  const keysOf = (el) => [...el.shadowRoot.querySelectorAll(".key")];
  const keyNamed = (el, key) => el.shadowRoot.querySelector(`.key[data-key="${key}"]`);
  // Home Assistant's confirmation dialog: what it asks, if anything
  const asking = () => window.confirming;
  const lastAction = () => window.actions[window.actions.length - 1];
  const lastCall = (hass) => hass.calls[hass.calls.length - 1];

  runChecks(async () => {
    // Job: processing
    let hass = makeHass({ "sensor.f2_status": "processing" });
    let job = addFeature({ type: "custom:xtool-job" }, { hass });
    await wait(50);
    check("job, processing", keysOf(job).map((k) => k.dataset.key).join() === "pause,cancel", "Pause and Cancel");
    keyNamed(job, "pause").click();
    check("job, processing", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "button", service: "press", data: { entity_id: "button.f2_pause" } }),
      "Pause presses the pause button");
    keyNamed(job, "cancel").click();
    await wait(20);
    check("job, processing", asking()?.title === "Cancel the job?" && asking().confirm_text === "Cancel the job" && asking().dismiss_text === "Keep it",
      "Cancel asks first, in Home Assistant's confirmation dialog");
    check("job, processing", JSON.stringify(lastAction()?.config.tap_action.target) === JSON.stringify({ entity_id: "button.f2_cancel" })
      && lastAction().config.tap_action.perform_action === "button.press" && lastAction().action === "tap", "as a perform-action, through Home Assistant's action handling");
    asking().answer(false);
    check("job, processing", lastCall(hass).data.entity_id === "button.f2_pause", "Keep it does not cancel");
    keyNamed(job, "cancel").click();
    await wait(20);
    asking().answer(true);
    check("job, processing", lastCall(hass).data.entity_id === "button.f2_cancel", "confirming cancels");

    // Job: idle and paused
    hass = makeHass({ "sensor.f2_status": "idle" });
    job = addFeature({ type: "custom:xtool-job" }, { hass });
    await wait(50);
    check("job, idle", keyNamed(job, "resume").textContent === "Start" && !keyNamed(job, "resume").disabled && keyNamed(job, "cancel").disabled,
      "Start, and Cancel off");
    hass = makeHass({ "sensor.f2_status": "paused" });
    job = addFeature({ type: "custom:xtool-job", confirm_cancel: false }, { hass });
    await wait(50);
    check("job, paused", keyNamed(job, "resume").textContent === "Resume", "Resume");
    keyNamed(job, "cancel").click();
    await wait(20);
    check("job, paused", !asking() && lastCall(hass).data.entity_id === "button.f2_cancel", "without asking, when turned off in the options");

    // Peripherals
    hass = makeHass({ "sensor.f2_status": "idle" });
    let row = addFeature({ type: "custom:xtool-peripherals" }, { hass });
    await wait(50);
    check("peripherals", keysOf(row).map((k) => k.dataset.key).join() === "power,exhaust,fill_light_front,fill_light_back,red_dot,autofocus",
      "every control the F2 Ultra UV has, in order, Autofocus last");
    check("peripherals", keyNamed(row, "power").querySelector("ha-icon") && !keyNamed(row, "power").querySelector("span"), "icons by default");
    keyNamed(row, "autofocus").click();
    check("peripherals", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "button", service: "press", data: { entity_id: "button.f2_autofocus" } }),
      "Autofocus is pressed, not toggled");
    check("peripherals", keyNamed(row, "exhaust").getAttribute("aria-pressed") === "true" && keyNamed(row, "red_dot").getAttribute("aria-pressed") === "false",
      "on and off shown");
    keyNamed(row, "exhaust").click();
    check("peripherals", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "switch", service: "turn_off", data: { entity_id: "switch.f2_exhaust" } }),
      "a tap turns the exhaust off");
    keyNamed(row, "fill_light_back").click();
    check("peripherals", lastCall(hass).domain === "light" && lastCall(hass).service === "turn_on", "a tap turns the back fill light on");
    keyNamed(row, "power").click();
    await wait(20);
    check("peripherals", !asking() && lastCall(hass).data.entity_id === "switch.f2_power", "Power turns off without asking while idle");
    hass = makeHass({ "sensor.f2_status": "processing" });
    row = addFeature({ type: "custom:xtool-peripherals", controls: ["red_dot", "power", "autofocus"], display: "both" }, { hass });
    await wait(50);
    check("peripherals, chosen", keysOf(row).map((k) => k.dataset.key).join() === "red_dot,power,autofocus" && keyNamed(row, "red_dot").textContent === "Red dot"
      && keyNamed(row, "red_dot").querySelector("ha-icon"), "the chosen controls, in the chosen order; Show: Icons and names");
    check("peripherals, chosen", keyNamed(row, "autofocus").disabled, "no Autofocus while a job runs");
    keyNamed(row, "power").click();
    await wait(20);
    check("peripherals, chosen", asking()?.title === "Turn off power?" && hass.calls.length === 0, "Power asks first while a job runs");
    asking().answer(false);
    row = addFeature({ type: "custom:xtool-peripherals", controls: ["red_dot"], display: "names" }, { hass });
    await wait(50);
    check("show", keyNamed(row, "red_dot").textContent === "Red dot" && !keyNamed(row, "red_dot").querySelector("ha-icon"), "Show: Names, without icons");

    // The fill lights stay buttons in the peripherals feature: on or off only
    hass = makeHass();
    row = addFeature({ type: "custom:xtool-peripherals" }, { hass });
    await wait(50);
    const front = keyNamed(row, "fill_light_front");
    check("fill lights as buttons", front.getAttribute("aria-pressed") === "true" && !front.classList.contains("dimmable"), "a button, with no dimming");
    front.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, clientX: 10, clientY: 10 }));
    front.dispatchEvent(new PointerEvent("pointermove", { bubbles: true, clientX: 200, clientY: 10 }));
    front.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, clientX: 200, clientY: 10 }));
    check("fill lights as buttons", hass.calls.length === 0, "dragging across a button does nothing");
    front.click();
    check("fill lights as buttons", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "light", service: "turn_off", data: { entity_id: "light.f2_fill_front" } }),
      "a tap turns it off");
    const options = document.createElement("xtool-feature-editor");
    options.hass = makeHass();
    options.context = { entity_id: "sensor.f2_status" };
    options.setConfig({ type: "custom:xtool-peripherals" });
    const optionNames = options.querySelector("ha-form").schema.map((s) => s.name);
    check("fill lights as buttons", !optionNames.includes("dim_lights") && optionNames.includes("animate_fan"), `the options have no dimming (${optionNames.join(", ")})`);
    const showField = options.querySelector("ha-form").schema.find((s) => s.name === "display");
    check("show", !optionNames.includes("show_names") && showField?.selector.select.options.map((o) => o.label).join() === "Icons,Names,Icons and names"
      && options.querySelector("ha-form").data.display === "icons", "Show: Icons (the default), Names, or Icons and names");

    // Fill light brightness: Home Assistant's own light brightness feature, for the chosen fill light
    hass = makeHass();
    const frontLight = addFeature({ type: "custom:xtool-fill-light", light: "fill_light_front" }, { hass });
    const backLight = addFeature({ type: "custom:xtool-fill-light", light: "fill_light_back" }, { hass });
    await wait(50);
    const frontFeature = frontLight.shadowRoot.querySelector("hui-card-feature");
    const backFeature = backLight.shadowRoot.querySelector("hui-card-feature");
    check("fill light", frontFeature?.feature.type === "light-brightness" && frontFeature.context.entity_id === "light.f2_fill_front"
      && backFeature?.context.entity_id === "light.f2_fill_back", "Home Assistant's light brightness feature, for the chosen light");
    check("fill light", !!frontFeature.shadowRoot.querySelector("hui-light-brightness-card-feature")?.hass, "drawn by Home Assistant, with hass");
    check("fill light", !frontLight.shadowRoot.querySelector("input, ha-control-slider"), "no slider of the card's own");
    check("fill light", frontLight.style.getPropertyValue("--feature-color") === "rgb(214, 228, 255)" && frontFeature.color === frontLight.style.getPropertyValue("--feature-color")
      && backLight.style.getPropertyValue("--feature-color").includes("--state-light-inactive-color"), "daylight when on, Home Assistant's off color when off");
    frontLight.hass = makeHass({ "light.f2_fill_front": { state: "on", attributes: { rgb_color: [255, 0, 0] } } });
    check("fill light", frontLight.style.getPropertyValue("--feature-color") === "rgb(255, 0, 0)", "a light's own color, when it has one");
    const stub = customElements.get("xtool-fill-light").getStubConfig(makeHass(), { entity_id: "sensor.f2_status" });
    check("fill light", stub.light === "fill_light_front", "a new feature starts with the first fill light");
    const lightOptions = document.createElement("xtool-feature-editor");
    lightOptions.hass = makeHass();
    lightOptions.context = { entity_id: "sensor.f2_status" };
    lightOptions.setConfig({ type: "custom:xtool-fill-light", light: "fill_light_back" });
    const lightField = lightOptions.querySelector("ha-form");
    check("fill light", lightField.data.light === "fill_light_back"
      && lightField.schema[0].selector.select.options.map((o) => o.value).join() === "fill_light_front,fill_light_back", "the editor offers each fill light");
    const none = addFeature({ type: "custom:xtool-fill-light" }, { hass: makeHass(), entityId: "sensor.p2_status" });
    await wait(50);
    check("fill light", !none.shadowRoot.querySelector("hui-card-feature"), "none for a laser without fill lights");

    // Animate fan: the exhaust's icon turns while it runs
    row = addFeature({ type: "custom:xtool-peripherals" }, { hass: makeHass() });
    await wait(50);
    check("animate fan", keyNamed(row, "exhaust").querySelector("ha-icon").classList.contains("spin"), "the running exhaust fan turns");
    check("animate fan", !keyNamed(row, "red_dot").querySelector("ha-icon").classList.contains("spin"), "other icons do not");
    row = addFeature({ type: "custom:xtool-peripherals", animate_fan: false }, { hass: makeHass() });
    await wait(50);
    check("animate fan", !keyNamed(row, "exhaust").querySelector("ha-icon").classList.contains("spin"), "it can be turned off");
    row = addFeature({ type: "custom:xtool-peripherals" }, { hass: makeHass({ "switch.f2_exhaust": "off" }) });
    await wait(50);
    check("animate fan", !keyNamed(row, "exhaust").querySelector("ha-icon").classList.contains("spin"), "a fan that is off is still");

    // Safety checks
    hass = makeHass({ "switch.f2_moved": "off" });
    row = addFeature({ type: "custom:xtool-safety" }, { hass });
    await wait(50);
    check("safety", keysOf(row).map((k) => k.dataset.key).join() === "flame_alarm,enclosure_stop,moved_stop,safety_key,access_control",
      "the three checks, the safety key and Access control");
    let keyOpened;
    row.addEventListener("hass-more-info", (ev) => (keyOpened = ev.detail.entityId));
    keyNamed(row, "safety_key").click();
    check("safety", keyOpened === "binary_sensor.f2_safety_key" && hass.calls.length === 0 && keyNamed(row, "safety_key").getAttribute("aria-pressed") === "true",
      "the safety key is shown (in: green); a tap opens it, nothing is switched");
    const access = keyNamed(row, "access_control");
    check("safety, access control", !access.classList.contains("fill") && access.style.getPropertyValue("--c") === "var(--green-color)" && access.getAttribute("aria-pressed") === "false",
      "Access control off is plain, not a red warning");
    const moved = keyNamed(row, "moved_stop"), flame = keyNamed(row, "flame_alarm");
    check("safety", moved.classList.contains("fill") && moved.style.getPropertyValue("--c") === "var(--red-color)" && moved.getAttribute("aria-pressed") === "false",
      "a check that is off is red");
    check("safety", !flame.classList.contains("fill") && flame.style.getPropertyValue("--c") === "var(--green-color)" && flame.getAttribute("aria-pressed") === "true",
      "a check that is on is green");
    check("safety", !row.shadowRoot.querySelector(".warn, i"), "no dots");
    keyNamed(row, "moved_stop").click();
    await wait(20);
    check("safety", !asking() && lastCall(hass).service === "turn_on", "turning a check on does not ask");
    keyNamed(row, "flame_alarm").click();
    await wait(20);
    check("safety", asking()?.text.includes("No flame alarm will be triggered") && asking().confirm_text === "Turn off",
      "turning the flame alarm off asks, with xTool's warning");
    check("safety", !document.querySelector("dialog") && !row.shadowRoot.querySelector("dialog"), "no dialog of the card's own");
    asking().answer(true);
    check("safety", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "switch", service: "turn_off", data: { entity_id: "switch.f2_flame" } }),
      "confirming turns it off");
    keyNamed(row, "access_control").click();
    await wait(20);
    check("safety, access control", asking()?.text.includes("autofocus, framing and starting from the machine are turned off") && asking().confirm_text === "Turn on",
      "turning Access control on asks, and says what it turns off");
    asking().answer(true);
    check("safety, access control", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "switch", service: "turn_on", data: { entity_id: "switch.f2_access_control" } }),
      "confirming turns it on");

    // While Access control is on, what it turns off is unavailable
    hass = makeHass({ "switch.f2_access_control": "on" });
    row = addFeature({ type: "custom:xtool-safety" }, { hass });
    await wait(50);
    check("access control on", keyNamed(row, "access_control").getAttribute("aria-pressed") === "true", "on is pressed");
    keyNamed(row, "access_control").click();
    await wait(20);
    check("access control on", asking()?.confirm_text === "Turn off", "turning it off asks");
    asking().answer(false);
    row = addFeature({ type: "custom:xtool-peripherals" }, { hass });
    await wait(50);
    check("access control on", keyNamed(row, "autofocus").disabled && !keyNamed(row, "power").disabled, "Autofocus in Controls is unavailable, the rest is not");
    job = addFeature({ type: "custom:xtool-job", controls: ["start", "pause", "cancel"] }, { hass });
    await wait(50);
    check("access control on", keyNamed(job, "resume").disabled && keyNamed(job, "pause").disabled,
      "no Start (from the machine) and no Pause, as in Studio");
    job = addFeature({ type: "custom:xtool-job", controls: ["pause", "cancel"] }, { hass: makeHass({ "switch.f2_access_control": "on", "sensor.f2_status": "processing" }) });
    await wait(50);
    check("access control on", keyNamed(job, "pause").disabled && !keyNamed(job, "cancel").disabled, "no Pause while a job runs; Cancel stays");
    job = addFeature({ type: "custom:xtool-job", controls: ["start"] }, { hass: makeHass({ "switch.f2_access_control": "on", "sensor.f2_status": "paused" }) });
    await wait(50);
    check("access control on", !keyNamed(job, "resume").disabled, "a paused job can still be resumed");

    // Settings: the laser's own
    hass = makeHass();
    row = addFeature({ type: "custom:xtool-settings" }, { hass });
    await wait(50);
    check("settings", keysOf(row).map((k) => k.dataset.key).join() === "buzzer,if2_buzzer,device_sleep", "buzzer reminders, the IF2 buzzer, device sleep");
    keyNamed(row, "device_sleep").click();
    await wait(20);
    check("settings", !asking() && lastCall(hass).domain === "switch", "a setting turns on and off with a tap, without asking");

    // No Accessories feature: the IF2 buzzer is in Configuration
    check("accessories", !window.customCardFeatures.some((f) => f.type === "xtool-accessories") && !customElements.get("xtool-accessories")
      && window.customCardFeatures.find((f) => f.type === "xtool-peripherals").name === "xTool controls"
      && window.customCardFeatures.find((f) => f.type === "xtool-safety").name === "xTool safety"
      && window.customCardFeatures.find((f) => f.type === "xtool-settings").name === "xTool configuration",
      "the picker offers xTool controls, xTool safety and xTool configuration, and no xTool accessories");
    row = addFeature({ type: "custom:xtool-settings", controls: ["if2_buzzer"] }, { hass });
    await wait(50);
    keyNamed(row, "if2_buzzer").click();
    check("settings", lastCall(hass).data.entity_id === "switch.if2_buzzer", "the IF2 buzzer, found on the accessory device");
    row = addFeature({ type: "custom:xtool-settings" }, { hass: makeHass({ "switch.if2_buzzer": "unavailable" }) });
    await wait(50);
    check("settings", keyNamed(row, "if2_buzzer")?.disabled, "kept in place, disabled, while the IF2 is unavailable");

    // Camera: Home Assistant's own image element, with buttons to switch cameras
    hass = makeHass();
    const camera = addFeature({ type: "custom:xtool-camera" }, { hass });
    await wait(80);
    const image = camera.shadowRoot.querySelector(".shot hui-image");
    check("camera", image?.cameraImage === "camera.f2_main" && image.entity === "camera.f2_main" && image.cameraView === "auto" && image.hass === hass,
      "Home Assistant's image element shows the main camera, in the Auto view");
    check("camera", !camera.shadowRoot.querySelector(".shot > img"), "no picture of the card's own");
    check("camera", keysOf(camera).map((k) => k.textContent).join() === "Main,Deep,Reset,Open", "buttons for both cameras, and Reset and Open for the main camera's crop");
    keyNamed(camera, "camera.f2_deep").click();
    await wait(50);
    const shown = () => [...camera.shadowRoot.querySelectorAll(".shot hui-image")].filter((i) => !i.hidden);
    check("camera", shown().length === 1 && shown()[0].cameraImage === "camera.f2_deep" && image.hidden && image.isConnected,
      "switching shows the deep camera's image; the main camera's stays, hidden, with its picture");
    check("camera", keysOf(camera).map((k) => k.textContent).join() === "Main,Deep", "no Reset or Open for the deep camera");
    keyNamed(camera, "camera.f2_main").click();
    await wait(50);
    check("camera", shown()[0] === image && camera.shadowRoot.querySelectorAll(".shot hui-image").length === 2, "and switching back shows the same image again");
    keyNamed(camera, "camera.f2_deep").click();
    await wait(50);
    let opened;
    camera.addEventListener("hass-more-info", (ev) => (opened = ev.detail.entityId));
    camera.shadowRoot.querySelector(".shot").click();
    check("camera", opened === "camera.f2_deep", "a tap opens the camera");
    const live = addFeature({ type: "custom:xtool-camera", camera: "Deep", camera_view: "live", show_switch: false }, { hass });
    await wait(80);
    check("camera, live", live.shadowRoot.querySelector("hui-image").cameraView === "live" && live.shadowRoot.querySelector("hui-image").cameraImage === "camera.f2_deep"
      && keysOf(live).length === 0, "the chosen camera, live, without buttons");

    const offCamera = addFeature({ type: "custom:xtool-camera" }, { hass: makeHass({ "sensor.f2_status": "off" }) });
    await wait(60);
    check("camera, off", offCamera.style.display === "" && offCamera.shadowRoot.querySelector(".shot hui-image")?.cameraImage === "camera.f2_main",
      "kept in place while the laser is off: Home Assistant's image element shows the camera as it is");

    // The updated time: when Home Assistant's image shows a new picture
    const imageLoad = (feature) => feature.shadowRoot.querySelector("hui-image").shadowRoot.querySelector("img").dispatchEvent(new Event("load"));
    imageLoad(camera);
    check("camera, time", camera.shadowRoot.querySelector(".time").textContent === "", "no time unless chosen");
    const stamped = addFeature({ type: "custom:xtool-camera", show_time: true }, { hass });
    await wait(60);
    check("camera, time", !stamped.shadowRoot.querySelector(".time hui-timestamp-display"), "no time before a picture arrives");
    imageLoad(stamped);
    const element = stamped.shadowRoot.querySelector(".time hui-timestamp-display");
    check("camera, time", !!element && element.ts instanceof Date && element.format === undefined && element.hass === hass
      && stamped.shadowRoot.querySelector(".time").textContent === "Updated ", "Home Assistant's timestamp display, in its default format outside the xTool card");
    const liveTime = addFeature({ type: "custom:xtool-camera", camera_view: "live", show_time: true }, { hass });
    await wait(60);
    imageLoad(liveTime);
    check("camera, time", liveTime.shadowRoot.querySelector(".time").textContent === "", "no updated time on a live stream");
    const cameraOptions = document.createElement("xtool-feature-editor");
    cameraOptions.hass = hass;
    cameraOptions.context = { entity_id: "sensor.f2_status" };
    cameraOptions.setConfig({ type: "custom:xtool-camera", show_time: true });
    const cameraForm = cameraOptions.querySelector("ha-form");
    check("camera, options", !cameraForm.schema.some((s) => s.name === "time_format") && cameraForm.schema.find((s) => s.name === "show_time").helper.includes("Time format"),
      "no Time format of its own: the card's is used");
    check("camera, options", cameraForm.schema.find((s) => s.name === "camera_view").selector.select.options.map((o) => o.label).join() === "Auto,Live"
      && cameraForm.data.camera_view === "auto" && !cameraForm.schema.some((s) => s.name === "refresh"), "Auto or Live, as in the picture cards; no refresh option");

    // Crop: the Crop button makes a tap mark the top-left corner, then the bottom-right corner
    hass = makeHass();
    const cropped = addFeature({ type: "custom:xtool-camera" }, { hass });
    await wait(80);
    check("camera, crop", !cropped.shadowRoot.querySelector(".controls, hui-card-feature"), "no crop number controls");
    const shot = cropped.shadowRoot.querySelector(".shot");
    const img = cropped.shadowRoot.querySelector(".shot hui-image").shadowRoot.querySelector("img");
    const tapAt = (u, v) => {
      const box = img.getBoundingClientRect();
      shot.dispatchEvent(new MouseEvent("click", { bubbles: true, composed: true, clientX: box.left + u * box.width, clientY: box.top + v * box.height }));
    };
    let cropOpened;
    cropped.addEventListener("hass-more-info", (ev) => (cropOpened = ev.detail.entityId));
    check("camera, crop", keysOf(cropped).map((k) => k.dataset.key).join() === "camera.f2_main,camera.f2_deep,crop,crop_reset"
      && keyNamed(cropped, "camera.f2_main").querySelector("ha-icon").icon === "mdi:crop-free"
      && keyNamed(cropped, "camera.f2_deep").querySelector("ha-icon").icon === "mdi:fullscreen"
      && keyNamed(cropped, "crop").querySelector("ha-icon").icon === "mdi:crop"
      && keyNamed(cropped, "crop_reset").querySelector("ha-icon").icon === "mdi:restore" && !keyNamed(cropped, "open"),
      "Main, Deep, Crop and Reset, with their icons; no Open");
    tapAt(0.5, 0.5);
    check("camera, crop", cropOpened === "camera.f2_main" && hass.calls.length === 0, "Crop off: a tap opens the camera");
    cropOpened = undefined;
    keyNamed(cropped, "crop").click();
    check("camera, crop", keyNamed(cropped, "crop").getAttribute("aria-pressed") === "true"
      && cropped.shadowRoot.querySelector(".hint").textContent === "Tap the top-left corner", "Crop on: pressed, and it asks for the top-left corner");
    tapAt(0.25, 0.2);
    check("camera, crop", !cropOpened && hass.calls.length === 0 && !cropped.shadowRoot.querySelector(".corner").hidden
      && cropped.shadowRoot.querySelector(".hint").textContent === "Tap the bottom-right corner", "the first tap marks the top-left corner and asks for the other");
    const before = cropped.shadowRoot.querySelector(".shot hui-image");
    tapAt(0.75, 0.8);
    check("camera, crop", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "xtool", service: "camera", data: {
      crop_width: 100, crop_height: 120, crop_center_x: 0, crop_center_y: 0, entity_id: "camera.f2_main" } })
      && cropped.shadowRoot.querySelector(".corner").hidden && cropped.shadowRoot.querySelector(".hint").textContent === ""
      && keyNamed(cropped, "crop").getAttribute("aria-pressed") === "false",
      `the second tap crops to the rectangle between them, in mm on the work surface, and Crop turns off (${JSON.stringify(lastCall(hass).data)})`);
    await wait(30);
    const shown = [...cropped.shadowRoot.querySelectorAll(".shot hui-image")].filter((i) => !i.hidden);
    check("camera, crop", shown.length === 1 && shown[0] !== before && !before.isConnected,
      "the new photo is shown at once: a new image replaces the old one");
    keyNamed(cropped, "crop_reset").click();
    check("camera, crop", JSON.stringify(lastCall(hass).data) === JSON.stringify({ crop_width: 200, crop_height: 200, crop_center_x: 0, crop_center_y: 0, entity_id: "camera.f2_main" }),
      "Reset: 200 x 200 mm, centered");
    const wholeHass = makeHass({ "number.f2_main_crop_width": "0" });
    const whole = addFeature({ type: "custom:xtool-camera" }, { hass: wholeHass });
    await wait(80);
    keyNamed(whole, "crop").click();
    whole.shadowRoot.querySelector(".shot").click();
    check("camera, crop", wholeHass.calls.length === 0 && whole.shadowRoot.querySelector(".hint").textContent === "Reset the crop to crop by tapping",
      "a whole-photo side (0) cannot be cropped by tapping until it is reset");
    const noTap = addFeature({ type: "custom:xtool-camera", crop: false }, { hass });
    await wait(80);
    let noTapOpened;
    noTap.addEventListener("hass-more-info", (ev) => (noTapOpened = ev.detail.entityId));
    noTap.shadowRoot.querySelector(".shot").click();
    check("camera, crop", noTapOpened === "camera.f2_main" && keysOf(noTap).map((k) => k.textContent).join() === "Main,Deep",
      "Crop by tapping off: a tap opens the camera, without Crop or Reset");
    keyNamed(cropped, "camera.f2_deep").click();
    await wait(60);
    const perspectiveKeys = () => [...cropped.shadowRoot.querySelectorAll(".perspective .key")];
    check("camera, perspective", perspectiveKeys().map((k) => k.dataset.key).join() === "uncorrected,rotated,straightened"
      && perspectiveKeys().find((k) => k.dataset.key === "straightened").getAttribute("aria-pressed") === "true"
      && perspectiveKeys().every((k) => k.querySelector("span") && !k.querySelector("ha-icon")),
      "the deep camera shows its perspective instead: a row of keys, with names, the one chosen pressed");
    perspectiveKeys().find((k) => k.dataset.key === "rotated").click();
    check("camera, perspective", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "select", service: "select_option", data: { entity_id: "select.f2_deep_perspective", option: "rotated" } }),
      "a tap selects the option");
    const iconCamera = addFeature({ type: "custom:xtool-camera", camera: "Deep", display: "icons" }, { hass });
    await wait(60);
    const iconPerspective = [...iconCamera.shadowRoot.querySelectorAll(".perspective .key")];
    check("camera, show", iconPerspective.length === 3 && iconPerspective.every((k) => k.querySelector("ha-icon") && !k.querySelector("span"))
      && keysOf(iconCamera).every((k) => k.querySelector("ha-icon") && !k.querySelector("span")), "Show: Icons, for the camera buttons and the perspective");
    cameraOptions.setConfig({ type: "custom:xtool-camera" });
    const cropNames = cameraOptions.querySelector("ha-form").schema.map((s) => s.name);
    check("camera, options", cropNames.includes("crop") && cropNames.includes("show_perspective") && !cropNames.some((n) => n.startsWith("crop_") || n === "show_crop")
      && cameraOptions.querySelector("ha-form").data.crop === true, `Crop by tapping (on by default) and the perspective (${cropNames.join(", ")})`);

    // IF2 2.0 fan: one row of keys, Off, A (Auto) and 1 to 4
    hass = makeHass();
    let fan = addFeature({ type: "custom:xtool-if2-fan" }, { hass });
    await wait(60);
    check("IF2 fan", keysOf(fan).map((k) => k.textContent).join() === "Off,A,1,2,3,4" && keyNamed(fan, "2").getAttribute("aria-pressed") === "true"
      && keyNamed(fan, "auto").title === "Auto" && !fan.shadowRoot.querySelector("ha-control-select"), "keys: Off, A, 1 to 4, with names; at speed 2");
    keyNamed(fan, "auto").click();
    check("IF2 fan", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "fan", service: "set_preset_mode", data: { entity_id: "fan.if2_fan", preset_mode: "Auto" } }),
      "A sets Auto: each job sets the speed");
    keyNamed(fan, "4").click();
    check("IF2 fan", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "fan", service: "set_percentage", data: { entity_id: "fan.if2_fan", percentage: 100 } }),
      "4 sets 100 %");
    keyNamed(fan, "off").click();
    check("IF2 fan", lastCall(hass).service === "turn_off", "Off turns the fan off");
    fan = addFeature({ type: "custom:xtool-if2-fan", display: "icons" }, { hass: makeHass({ "fan.if2_fan": { attributes: { preset_mode: "Auto" } } }) });
    await wait(60);
    check("IF2 fan", keyNamed(fan, "auto").getAttribute("aria-pressed") === "true" && keysOf(fan).every((k) => k.querySelector("ha-icon") && !k.querySelector("span")),
      "in Auto: A pressed; Show: Icons");
    const fanOptions = document.createElement("xtool-feature-editor");
    fanOptions.hass = hass;
    fanOptions.context = { entity_id: "sensor.f2_status" };
    fanOptions.setConfig({ type: "custom:xtool-if2-fan" });
    const fanForm = fanOptions.querySelector("ha-form");
    check("IF2 fan, options", fanForm.schema.map((s) => s.name).join() === "display" && fanForm.data.display === "names",
      `Show only (${fanForm.schema.map((s) => s.name).join(", ")})`);

    // The first IF2: its gear select, in the same control
    const firstIf2 = () => {
      const h = makeHass();
      delete h.entities["fan.if2_fan"];
      delete h.states["fan.if2_fan"];
      h.entities["select.if2_gear"] = { entity_id: "select.if2_gear", device_id: "dev_if2", platform: "xtool", translation_key: "accessory_ductfan_gear_select" };
      h.states["select.if2_gear"] = { entity_id: "select.if2_gear", state: "2", attributes: { friendly_name: "IF2 gear", options: ["Off", "1", "2", "3", "4"] } };
      return h;
    };
    hass = firstIf2();
    fan = addFeature({ type: "custom:xtool-if2-fan", options: ["Off", "4"] }, { hass });
    await wait(60);
    check("first IF2", keysOf(fan).map((k) => k.dataset.key).join() === "Off,4" && !keysOf(fan).some((k) => k.getAttribute("aria-pressed") === "true"),
      "the chosen gears, as keys");
    keyNamed(fan, "4").click();
    check("first IF2", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "select", service: "select_option", data: { entity_id: "select.if2_gear", option: "4" } }),
      "a tap selects the gear");
    check("feature picker", window.customCardFeatures.find((f) => f.type === "xtool-if2-fan").isSupported(hass, { entity_id: "sensor.f2_status" }),
      "offered for the first IF2");

    hass = makeHass();
    const noFan = addFeature({ type: "custom:xtool-if2-fan" }, { hass, entityId: "sensor.p2_status" });
    await wait(50);
    check("IF2 fan", keysOf(noFan).length === 0, "nothing for a laser without an IF2");
    const unseen = addFeature({ type: "custom:xtool-if2-fan" }, { hass: makeHass({ "fan.if2_fan": "unavailable" }) });
    await wait(60);
    check("IF2 fan, unavailable", unseen.style.display === "" && keysOf(unseen).length > 0 && keysOf(unseen).every((k) => k.disabled),
      "kept in place, disabled, while the laser does not see the IF2");

    // Focus: Autofocus, then - and + around a field to type the thickness, in one row
    hass = makeHass();
    let focus = addFeature({ type: "custom:xtool-focus" }, { hass });
    await wait(50);
    const field = () => focus.shadowRoot.querySelector(".row .height input");
    check("focus", [...focus.shadowRoot.querySelector(".row").children].map((c) => c.dataset.key ?? c.className).join() === "autofocus,down,height,up"
      && field().value === "36.1" && !focus.shadowRoot.querySelector(".height .unit"),
      "Autofocus, -, the thickness (36.1 mm) in a field, +");
    keyNamed(focus, "autofocus").click();
    check("focus", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "button", service: "press", data: { entity_id: "button.f2_autofocus" } }),
      "Autofocus is pressed");
    keyNamed(focus, "up").click();
    check("focus", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "number", service: "set_value", data: { entity_id: "number.f2_focus_height", value: 36.2 } }),
      "+ moves the head up by the step (0.1 mm)");
    keyNamed(focus, "down").click();
    check("focus", lastCall(hass).data.value === 36, "- moves it down");
    field().value = "40,5";
    field().dispatchEvent(new Event("change"));
    check("focus, typed", lastCall(hass).data.value === 40.5, "typing a thickness focuses there (a decimal comma works)");
    const calls = hass.calls.length;
    field().value = "abc";
    field().dispatchEvent(new Event("change"));
    check("focus, typed", hass.calls.length === calls && field().value === "36.1", "something that is not a number is put back");
    focus = addFeature({ type: "custom:xtool-focus", step: 0.5 }, { hass: makeHass({ "number.f2_focus_height": "149.95" }) });
    await wait(50);
    const focusHass = focus._hass;
    keyNamed(focus, "up").click();
    check("focus", lastCall(focusHass).data.value === 150, "always 0.1 mm a step, kept within the height's range");
    check("focus, options", !customElements.get("xtool-focus").getConfigElement
      && !window.customCardFeatures.find((f) => f.type === "xtool-focus").configurable, "no options");
    focus = addFeature({ type: "custom:xtool-focus" }, { hass: makeHass({ "sensor.f2_engraving_lens": "small" }) });
    await wait(50);
    check("focus, inner lens", focus.style.display === "none" && keysOf(focus).length === 0,
      "with the inner engraving lens there is no focusing, so the feature is not shown");
    focus = addFeature({ type: "custom:xtool-focus" }, { hass: makeHass({ "sensor.f2_status": "processing" }) });
    await wait(50);
    check("focus, busy", keyNamed(focus, "autofocus").disabled && !keyNamed(focus, "up").disabled, "no Autofocus while a job runs");
    focus = addFeature({ type: "custom:xtool-focus" }, { hass: makeHass({ "switch.f2_access_control": "on" }) });
    await wait(50);
    check("focus, access control", keyNamed(focus, "autofocus").disabled && !keyNamed(focus, "up").disabled && !field().disabled,
      "no Autofocus while Access control is on; the thickness can still be set");
    const p2Focus = addFeature({ type: "custom:xtool-focus" }, { hass, entityId: "sensor.p2_status" });
    await wait(50);
    check("focus", keysOf(p2Focus).length === 0 && !p2Focus.shadowRoot.querySelector(".height input"), "nothing for a laser without focus controls");
    const offFocus = addFeature({ type: "custom:xtool-focus" }, { hass: makeHass({ "sensor.f2_status": "off", "number.f2_focus_height": "unavailable" }) });
    await wait(50);
    check("focus, off", offFocus.style.display === "" && keyNamed(offFocus, "up")?.disabled && keyNamed(offFocus, "autofocus")?.disabled && offFocus.shadowRoot.querySelector(".height input")?.disabled,
      "kept in place, disabled, while the laser is off");

    // Job: the buttons chosen, in order
    hass = makeHass({ "sensor.f2_status": "processing" });
    job = addFeature({ type: "custom:xtool-job", controls: ["cancel", "start", "pause"] }, { hass });
    await wait(50);
    check("job, chosen", keysOf(job).map((k) => k.dataset.key).join() === "cancel,resume,pause" && keyNamed(job, "resume").disabled && !keyNamed(job, "pause").disabled,
      "Cancel, Start and Pause apart, in the chosen order; Start is off while the job runs");
    job = addFeature({ type: "custom:xtool-job", controls: ["start_pause"] }, { hass: makeHass({ "sensor.f2_status": "paused" }) });
    await wait(50);
    check("job, chosen", keysOf(job).map((k) => k.textContent).join() === "Resume", "Start / Pause alone: Resume while paused");
    const jobOptions = document.createElement("xtool-feature-editor");
    jobOptions.hass = hass;
    jobOptions.context = { entity_id: "sensor.f2_status" };
    jobOptions.setConfig({ type: "custom:xtool-job" });
    const jobForm = jobOptions.querySelector("ha-form");
    check("job, options", jobForm.data.controls.join() === "start_pause,cancel"
      && jobForm.schema[0].selector.select.options.map((o) => o.label).join() === "Start / Pause,Start,Pause,Cancel" && jobForm.schema[0].selector.select.reorder,
      "Buttons: Start / Pause and Cancel by default, from Start / Pause, Start, Pause and Cancel, in order");

    // A laser without the parts: nothing to show
    hass = makeHass();
    row = addFeature({ type: "custom:xtool-safety" }, { hass, entityId: "sensor.p2_status" });
    await wait(50);
    check("P2 safety", keysOf(row).length === 0, "no buttons for checks the laser does not have");

    // The features are offered only for lasers that have their parts
    const offered = Object.fromEntries(window.customCardFeatures.map((f) => [f.type, f.isSupported(makeHass(), { entity_id: "sensor.p2_status" })]));
    check("feature picker", offered["xtool-job"] && offered["xtool-peripherals"] && !offered["xtool-fill-light"] && !offered["xtool-safety"] && !offered["xtool-if2-fan"] && !offered["xtool-camera"] && !offered["xtool-focus"],
      `offered for the P2: ${Object.entries(offered).filter(([, v]) => v).map(([k]) => k).join(", ")}`);
  });
</script>
