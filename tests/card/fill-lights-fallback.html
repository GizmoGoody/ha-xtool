<!doctype html>
<meta charset="utf-8">
<title>xTool card: fill light slider before Home Assistant's slider is loaded</title>
<style>
  body { margin: 0; padding: 16px; background: #111; color: #ddd; font: 13px Roboto, "Segoe UI", sans-serif; }
  pre { white-space: pre-wrap; }
</style>
<script>window.noHaSlider = true;</script>
<script src="stand-ins.js"></script>
<script src="../../custom_components/xtool/frontend/xtool-card.js"></script>
<script src="checks.js"></script>
<div id="cards"></div>
<pre id="report" data-result="running">running</pre>
<script>
  runChecks(async () => {
    const hass = makeHass();
    const front = addFeature({ type: "custom:xtool-fill-light", light: "fill_light_front" }, { hass });
    const back = addFeature({ type: "custom:xtool-fill-light", light: "fill_light_back" }, { hass });
    await wait(50);
    const input = front.shadowRoot.querySelector('input[type="range"]');
    check("fallback slider", !!input && !front.shadowRoot.querySelector("ha-control-slider"), "a range input, while Home Assistant's slider is not loaded");
    check("fallback slider", input.value === "50" && input.style.getPropertyValue("--value") === "50%"
      && back.shadowRoot.querySelector("input").style.getPropertyValue("--value") === "0%", "showing each light's brightness (the light that is off, empty)");
    input.value = "70";
    input.dispatchEvent(new Event("input"));
    input.dispatchEvent(new Event("change"));
    check("fallback slider", JSON.stringify(hass.calls[0]) === JSON.stringify({ domain: "light", service: "turn_on", data: { entity_id: "light.f2_fill_front", brightness_pct: 70 } }),
      "a change sets the brightness");

    // Home Assistant's slider is loaded later (with the first light feature it draws)
    defineSlider();
    await wait(100);
    check("fallback slider", !!front.shadowRoot.querySelector("ha-control-slider") && !front.shadowRoot.querySelector("input"),
      "the feature switches to Home Assistant's slider once it is loaded");
  });
</script>
